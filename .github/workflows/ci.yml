
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]



permissions:
  contents: read
  packages: write



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        run: node --check backend/src/server.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build backend Docker image
        run: docker build -t shopsphere-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t shopsphere-frontend:ci ./frontend

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        if: github.event_name == 'push'
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - name: Build and push backend image
        if: github.event_name == 'push'
        run: |
          docker build -t "$BACKEND_IMAGE:latest" ./backend
          docker push "$BACKEND_IMAGE:latest"

      - name: Build and push frontend image
        if: github.event_name == 'push'
        run: |
          docker build -t "$FRONTEND_IMAGE:latest" ./frontend
          docker push "$FRONTEND_IMAGE:latest"


