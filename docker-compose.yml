services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: shopsphere
      DB_USER: shopapp
      DB_PASSWORD: ShopAppPassword123
      JWT_SECRET: 1ae58380af52339da83ad36b8509825cb48d570ef5e205e82e7851dba7692848
    expose:
      - "5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: shopsphere-database
    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: shopapp
      MYSQL_PASSWORD: ShopAppPassword123
      MYSQL_ROOT_PASSWORD: rootAdmin123
    volumes:
      - shopsphere-db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  shopsphere-db-data: {}